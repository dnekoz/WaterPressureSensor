; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

lib_deps =
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit SSD1306@2.5.17
	adafruit/Adafruit BusIO@1.17.4
	tzapu/WiFiManager@2.0.17
	knolleary/PubSubClient@2.8
	bblanchon/ArduinoJson@7.4.3

monitor_speed = 115200
board_build.filesystem = littlefs

; Тесты чистой логики, выполняются на хосте: pio test -e native
; Собирается только src/Logic.cpp — остальные модули завязаны на железо.
[env:native]
platform = native
test_framework = unity
extra_scripts = pre:scripts/native_toolchain.py
build_src_filter = +<Logic.cpp>
test_build_src = yes
lib_deps = bblanchon/ArduinoJson@7.4.3
build_flags =
	-std=c++14
	-I src
	-D__USE_MINGW_ANSI_STDIO=1
