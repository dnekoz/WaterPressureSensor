; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Версия прошивки задаётся здесь и только здесь: она нужна и Config.h, и Logic.cpp,
; а Logic.cpp намеренно не включает Config.h (он собирается на хосте). Копия
; константы в двух файлах разошлась бы молча — в discovery уходила бы не та.
[platformio]
default_envs = d1_mini

[common]
fw_version = 3.1
; Use Arduino Core's bundled NON-OS SDK 3.0.5 and its matching SDK3 ABI.
sdk_flags =
	-DPIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK305
	-DWPS_NONOS_SDK_RELEASE='"3.0.5"'

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
extra_scripts =
	pre:scripts/embed_web.py
	post:scripts/sdk_map.py

lib_deps =
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit SSD1306@2.5.17
	adafruit/Adafruit BusIO@1.17.4
	knolleary/PubSubClient@2.8
	bblanchon/ArduinoJson@7.4.3

build_flags =
	${common.sdk_flags}
	-Wall
	-Wextra
	-DFW_VERSION='"${common.fw_version}"'

monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
board_build.filesystem = littlefs

; Temporary observational build; normal d1_mini has no diagnostic code/RAM.
[env:d1_mini_diag]
extends = env:d1_mini
build_flags =
	${common.sdk_flags}
	-Wall
	-Wextra
	-DFW_VERSION='"${common.fw_version}-diag-sdk305"'
	-DWPS_WIFI_DIAGNOSTICS

; Тесты чистой логики, выполняются на хосте: pio test -e native
; Собирается только src/Logic.cpp — остальные модули завязаны на железо.
[env:native]
platform = native
test_framework = unity
extra_scripts = pre:scripts/native_toolchain.py
build_src_filter = +<Logic.cpp>
test_build_src = yes
lib_deps = bblanchon/ArduinoJson@7.4.3
build_flags =
	-std=c++14
	-Wall
	-Wextra
	-I src
	-I test/fakes
	-D__USE_MINGW_ANSI_STDIO=1
	-DFW_VERSION='"${common.fw_version}"'
